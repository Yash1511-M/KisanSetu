        function voiceAssistant() {

    document.body.innerHTML = `
        <h1>🎙️ किसान Voice Assistant</h1>

        <p>नमस्ते! मैं आपकी मदद कर सकता हूँ।</p>

        <hr>
        <button onclick="startVoice()">🎤 बोलकर पूछें</button>

<p id="voiceText">कुछ बोलिए...</p>

        <h3>आप क्या जानना चाहते हैं?</h3>

        <button onclick="showQueue()">👥 मेरी Queue बताओ</button>

        <br><br>

        <button onclick="showCentre()">📍 खरीद केंद्र बताओ</button>

        <br><br>

        <button onclick="showPayment()">💰 Payment Status</button>

        <br><br>

        <button onclick="openDashboard()">⬅️ Dashboard</button>
    `;
}
function showQueue() {
    alert("आपसे पहले 12 किसान हैं। अनुमानित समय 45 मिनट है।");
}

function showCentre() {
    alert("आपका नज़दीकी केंद्र Kanpur Centre 01 है। दूरी 2.4 km है।");
}

function showPayment() {
    alert("आपका payment अभी processing में है।");
}
function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Is browser mein voice recognition supported nahi hai.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "hi-IN";
    recognition.interimResults = false;
    recognition.continuous = false;

    document.getElementById("voiceText").innerText =
        "🎤 सुन रहा हूँ...";

    recognition.start();

    recognition.onresult = function(event) {

        const text = event.results[0][0].transcript;

        document.getElementById("voiceText").innerText =
            "आपने कहा: " + text;

        if (
            text.includes("queue") ||
            text.includes("क्यू") ||
            text.includes("कतार")
        ) {
            showQueue();
        }

        else if (
            text.includes("center") ||
            text.includes("केंद्र")
        ) {
            showCentre();
        }

        else if (
            text.includes("payment") ||
            text.includes("पेमेंट")
        ) {
            showPayment();
        }

        else {
            alert("माफ़ कीजिए, मैं यह समझ नहीं पाया।");
        }
    };

    recognition.onerror = function(event) {
        document.getElementById("voiceText").innerText =
            "❌ Voice error: " + event.error;
    };
}
